name: Build TWRP for warsaw

# 手动触发或 push 到 master（改动设备树/mk/workflow 时自动跑）
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'device.mk'
      - 'BoardConfig.mk'
      - 'twrp_warsaw.mk'
      - 'recovery.fstab'
      - 'system.prop'
      - '.github/workflows/**'

jobs:
  build:
    name: Build twrp_warsaw
    runs-on: ubuntu-22.04
    timeout-minutes: 360   # 6h 上限
    steps:
      - name: Free disk space & install deps
        run: |
          set -e
          # 清理不需要的大目录
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          # 加 swap 防止编译 OOM
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo apt-get update
          sudo apt-get install -y \
            git git-lfs python3 python3-pip repo bc bison curl flex \
            libssl-dev libncurses-dev libzstd-dev libxml2-utils \
            gperf build-essential zip unzip ccache rsync
          df -h

      - name: Init TWRP source tree
        run: |
          set -e
          mkdir -p "$HOME/twrp"
          cd "$HOME/twrp"
          repo init -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git \
              -b twrp-16.0 --depth=1 --no-repo-verify
          repo sync -c -j"$(nproc)" --no-tags --no-clone-bundle --no-tags
          df -h

      - name: Place warsaw device tree
        run: |
          set -e
          cd "$HOME/twrp"
          mkdir -p device/xiaomi
          rm -rf device/xiaomi/warsaw
          git clone --depth=1 https://github.com/wumisc/twrp_device_xiaomi_warsaw.git \
              device/xiaomi/warsaw

      - name: Build bootimage (TWRP recovery)
        run: |
          set -e
          cd "$HOME/twrp"
          source build/envsetup.sh
          lunch twrp_warsaw-eng
          # runner 内存有限，用 -j4；如 OOM 可改 -j2
          mka bootimage -j4
          ls -la out/target/product/warsaw/

      - name: Rename artifact
        run: |
          cd "$HOME/twrp/out/target/product/warsaw"
          DATE=$(date +%Y%m%d)
          cp boot.img "twrp_warsaw_${DATE}.img"
          ls -la twrp_warsaw_*.img

      - name: Upload TWRP image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-warsaw-img
          path: ${{ env.HOME }}/twrp/out/target/product/warsaw/twrp_warsaw_*.img
          retention-days: 30
