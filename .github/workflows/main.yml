name: Build TWRP for warsaw

on:
  workflow_dispatch:

jobs:
  build:
    name: Build twrp_warsaw
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Cleanup disk
        uses: rokibhasansagar/slimhub_actions@main

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 0
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          max-size: 10G

      - name: Setup zram
        run: |
          sudo apt install linux-modules-extra-$(uname -r) zram-tools -y
          sudo modprobe zram
          sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
          sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
          sudo systemctl restart zramswap
          zramctl

      - name: Setup environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update && sudo apt upgrade -y
          sudo apt install repo -y
          git config --global user.name ${{ shturl.cc/0m }}
          git config --global user.email ${{ shturl.cc/0m }}@users.noreply.github.com

      - name: Sync TWRP source
        run: |
          repo init -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git -b twrp-16.0 --depth=1
          (while true; do echo "Syncing source..."; sleep 60; done) &
          TIP_PID=$!
          repo sync
          kill $TIP_PID && exit 0

      - name: Place warsaw device tree
        run: |
          git clone https://github.com/wumisc/twrp_device_xiaomi_warsaw.git -b master device/xiaomi/warsaw

      - name: Build TWRP
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          lunch twrp_warsaw-eng
          (while true; do echo `date +%T` "Building TWRP..."; free -h; sleep 10; done) &
          TIP_PID=$!
          m recoveryimage
          mv out/target/product/warsaw/recovery.img out/target/product/warsaw/TWRP-3.7.1-16-warsaw-$(date +%F).img
          kill $TIP_PID && exit 0

      - name: Upload TWRP image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-warsaw-img
          path: out/target/product/warsaw/TWRP-3.7.1-16-warsaw-*.img
          retention-days: 30
